name: loliexpress_erp
description: A new Flutter project.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # Core UI and responsive design
  sizer: ^2.0.15
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  web: ^1.1.1

  # Feature dependencies
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.4
  dio: ^5.4.0
  fluttertoast: ^8.2.4
  fl_chart: ^0.70.1
  flutter_slidable: ^3.1.1
  url_launcher: ^6.3.1
  google_maps_flutter: ^2.12.3
  geolocator: ^13.0.4
  mobile_scanner: ^6.0.11
  printing: ^5.14.2
  share_plus: ^12.0.1
  supabase_flutter: ^2.8.0
  file_picker: ^10.3.7
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  image_picker: ^1.2.0
  intl: ^0.18.1
  pdf: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_loliexpress.png"
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: "assets/images/logo_loliexpress.png"

flutter_native_splash:
  color: "#1A1A2E"
  image: "assets/images/logo_loliexpress.png"
  android: true
  ios: true

name: LoliExpress ERP CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - run: cp env.json.example env.json
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: supabase start
      - run: supabase db reset
      - name: Verify local Supabase services and migrations
        run: |
          supabase status
          supabase migration list --local
      - run: supabase db lint --local --level warning
      - run: supabase test db
      - name: Test Edge Function units
        run: deno test --allow-env --allow-net supabase/functions/create_user/index_test.ts supabase/functions/bootstrap_admin/index_test.ts
      - name: Test Edge Functions against local Supabase
        run: supabase/tests/edge_functions_integration.sh

  web-build:
    runs-on: ubuntu-latest
    needs: [flutter, supabase]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - run: cp env.json.example env.json
      - run: flutter pub get
      - name: Scaffold ignored web platform
        run: flutter create --platforms web .
      - run: flutter build web --release --dart-define-from-file=env.json
